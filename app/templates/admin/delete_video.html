{% extends "admin/admin_base.html" %}

{% block admin_content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card border-0 shadow-sm">

            <div class="card-body text-center p-5">

                <div class="text-danger fs-1 mb-3">
                    <i class="bi bi-camera-video-off"></i>
                </div>

                <h3 class="fw-bold mb-3">
                    Delete Sign Video?
                </h3>

                <p class="text-muted">

                    You are about to delete the video for:

                    <strong>
                        {{ sign.word }}
                    </strong>

                </p>

                <p class="text-muted">
                    The sign record will remain in the database.
                    Only the video will be removed.
                </p>

                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <div class="d-flex justify-content-center gap-2">

                        <a
                            href="{{ url_for('admin.videos') }}"
                            class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button
                            type="submit"
                            class="btn btn-danger">

                            <i class="bi bi-trash me-1"></i>
                            Delete Video

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
